name: ci

on:
  push:
    branches:
      - main
      - merge-frontend
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw verify

  frontend:
    name: Frontend install and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  postman-api-tests:
    name: Postman API tests
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create auth-secrets.properties
        run: |
          cat > auth-secrets.properties <<EOF
          budget.auth.secret=${{ secrets.BUDGET_AUTH_SECRET }}
          budget.auth.accessTokenExpiresInSeconds=3600
          budget.auth.issuer=budget-service
          EOF

      - name: Start backend stack
        run: docker compose up -d --build

      - name: Wait for backend to become ready
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)
          
            if [ "$STATUS" != "000" ]; then
              echo "Backend is ready, HTTP status: $STATUS"
              exit 0
            fi
          
            echo "Waiting for backend..."
            sleep 5
          done
          
          echo "Backend did not start in time"
          docker compose ps
          docker compose logs --no-color
          exit 1
          
            - name: Setup Node 20
              uses: actions/setup-node@v4
              with:
                node-version: '20'
          
            - name: Install Newman
              run: npm install -g newman
          
            - name: Run Postman collection
              run: |
                newman run tests/postman/budget-tracker-combined.postman_collection.json \
                  --env-var baseUrl=http://localhost:8080
          
            - name: Show Docker logs on failure
              if: failure()
              run: docker compose logs --no-color
          
            - name: Stop containers
              if: always()
              run: docker compose down -v

  docker-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - postman-api-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/service-java/Dockerfile
          push: true
          tags: |
            ghcr.io/p0lt3rg31st/budget-service:latest
            ghcr.io/p0lt3rg31st/budget-service:${{ github.sha }}